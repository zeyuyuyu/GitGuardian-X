<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitGuardian-X | Security Made Fun</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gray-900 text-white">
    <div id="app" class="min-h-screen">
        <!-- Achievement Popup -->
        <div id="achievement-popup" class="fixed top-5 right-5 animate__animated animate__bounceIn hidden">
            <div class="bg-purple-600 rounded-lg p-4 shadow-lg">
                <h3 class="text-xl font-bold">🏆 Achievement Unlocked!</h3>
                <p id="achievement-text"></p>
            </div>
        </div>

        <!-- Security Score Banner -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-4">
            <div class="container mx-auto flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="text-2xl font-bold">Your Security Score: <span id="security-score" class="text-yellow-300">850</span></div>
                    <div class="text-sm">Rank: <span class="font-bold text-yellow-300">#42</span> of 12,849 users</div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="animate-ping absolute h-3 w-3 rounded-full bg-yellow-400 opacity-75"></span>
                    <span class="text-sm">🔥 3-Day Streak!</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="container mx-auto py-8">
            <!-- Security Challenge Card -->
            <div class="bg-gray-800 rounded-lg p-6 mb-8 transform hover:scale-105 transition-all">
                <h2 class="text-xl font-bold mb-4">🎯 Daily Security Challenge</h2>
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-300">Secure 3 repositories today</p>
                        <div class="w-64 h-3 bg-gray-700 rounded-full mt-2">
                            <div class="w-1/3 h-full bg-green-500 rounded-full"></div>
                        </div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-yellow-300">+500</div>
                        <div class="text-sm text-gray-400">points</div>
                    </div>
                </div>
            </div>

            <!-- Social Leaderboard -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-bold mb-4">🏆 Top Security Champions</h2>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-2 bg-gray-700 rounded">
                            <div class="flex items-center space-x-3">
                                <span class="text-yellow-300">1</span>
                                <img src="https://api.dicebear.com/6.x/avataaars/svg?seed=Felix" class="w-8 h-8 rounded-full">
                                <span>SecurityNinja</span>
                            </div>
                            <span class="font-bold">1,337 pts</span>
                        </div>
                        <!-- More leaderboard entries... -->
                    </div>
                </div>

                <!-- Security Badge Collection -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-bold mb-4">🎖️ Your Badges</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <div class="text-center">
                            <div class="w-16 h-16 mx-auto mb-2 bg-purple-500 rounded-full flex items-center justify-center">
                                <span class="text-2xl">🛡️</span>
                            </div>
                            <p class="text-sm">Guardian Elite</p>
                        </div>
                        <!-- More badges... -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Viral Share Button -->
        <div class="fixed bottom-5 right-5">
            <button onclick="shareAchievement()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-full shadow-lg flex items-center space-x-2">
                <span>Share Achievement</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        function shareAchievement() {
            const text = `🚀 Just reached Security Level 42 on GitGuardian-X! My repositories are fortress-safe. Join me in making GitHub more secure! 🛡️ #GitGuardianX #CyberSecurity`;
            if (navigator.share) {
                navigator.share({
                    title: 'My GitGuardian-X Achievement',
                    text: text,
                    url: window.location.href,
                });
            } else {
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
            }
        }

        // Show random achievements periodically
        setInterval(() => {
            const achievements = [
                '🔥 3-day streak! Keep it up!',
                '🎯 Found and fixed 5 security issues!',
                '🌟 Reached Top 1% of users!',
                '🚀 Level Up! Now Level 43!'
            ];
            const popup = document.getElementById('achievement-popup');
            const text = document.getElementById('achievement-text');
            text.textContent = achievements[Math.floor(Math.random() * achievements.length)];
            popup.classList.remove('hidden');
            setTimeout(() => popup.classList.add('hidden'), 3000);
        }, 45000);
    </script>
</body>
</html>
